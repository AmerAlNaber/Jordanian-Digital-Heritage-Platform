[project]
name = "jdhp-api"
version = "0.1.0"
description = "Jordanian Digital Heritage Platform: API. The only owner of the database schema and every write path."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.37",
  "pydantic>=2.11",
  "pydantic-settings>=2.11",
  "sqlalchemy[asyncio]>=2.0.43,<2.1",
  "alembic>=1.16",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "pgvector>=0.4",
  "uuid-utils>=0.11",
  "PyJWT[crypto]>=2.10",
  "cryptography>=45",
  "cerbos>=0.16",
  "redis>=6.4",
  "boto3>=1.40",
  "opensearch-py>=3.0",
  "httpx>=0.28",
  "structlog>=25.4",
  "orjson>=3.11",
  "python-multipart>=0.0.20",
  "defusedxml>=0.7",
  "celery[redis]>=5.5",
  "pyvips>=3.0",
  "jdhp-adapters",
  "jdhp-metadata",
  "numpy>=2.1",
]

[project.optional-dependencies]
seed = ["Pillow>=11", "arabic-reshaper>=3.0", "python-bidi>=0.6"]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "pytest-cov>=6.2", "httpx>=0.28", "moto[s3]>=5.1", "fakeredis>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdhp_api"]
