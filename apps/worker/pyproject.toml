[project]
name = "jdhp-worker"
version = "0.1.0"
description = "Jordanian Digital Heritage Platform: Celery workers. A thin task layer over the API's services (ADR-0001 D17)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.5",
  "pyvips>=3.0",
  "Pillow>=11",
  "jdhp-api",
  "jdhp-adapters",
  "jdhp-metadata",
]

[project.optional-dependencies]
seed = ["jdhp-api[seed]"]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "moto[s3]>=5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdhp_worker"]
