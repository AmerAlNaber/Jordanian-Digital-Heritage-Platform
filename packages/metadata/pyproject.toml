[project]
name = "jdhp-metadata"
version = "0.1.0"
description = "Jordanian Digital Heritage Platform: Dublin Core, MODS, MARC, METS, PREMIS and ALTO mappers and validators."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11",
  "lxml>=6.0",
  "defusedxml>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdhp_metadata"]
