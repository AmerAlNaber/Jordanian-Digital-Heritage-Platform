[project]
name = "jdhp-adapters"
version = "0.1.0"
description = "Jordanian Digital Heritage Platform: OCR, language model and embedding provider interfaces and implementations."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11",
  "httpx>=0.28",
  "jdhp-metadata",
]

[project.optional-dependencies]
azure = ["azure-ai-documentintelligence>=1.0"]
claude = ["anthropic>=0.69"]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdhp_adapters"]
