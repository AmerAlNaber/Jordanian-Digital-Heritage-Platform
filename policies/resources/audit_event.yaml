# The audit viewer (ADM-5). Rights officers and platform admins read; nobody writes through the API.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: audit_event
  importDerivedRoles: [common]
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///empty.json
  rules:
    - actions: [list, export, verify]
      effect: EFFECT_ALLOW
      roles: [rights_officer, platform_admin]
      condition:
        match:
          expr: P.attr.mfa == true
