# Platform operations. Break-glass needs a second admin and is audited at high severity (SEC-8).
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: system
  importDerivedRoles: [common]
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///owned.json
  rules:
    - actions: [request_break_glass, view_dashboard, manage_configuration]
      effect: EFFECT_ALLOW
      roles: [platform_admin]
      condition:
        match:
          expr: P.attr.mfa == true

    - actions: [approve_break_glass]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: R.attr.requester_id == P.id

    - actions: [approve_break_glass]
      effect: EFFECT_ALLOW
      roles: [platform_admin]
      condition:
        match:
          expr: P.attr.mfa == true

    - actions: [view_dashboard]
      effect: EFFECT_ALLOW
      roles: [curator, reviewer, rights_officer]
