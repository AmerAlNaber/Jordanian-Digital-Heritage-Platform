# Continuous integration for the core layer. Mirrors the pipeline section of SPEC.md:
# lint and type checks, unit and policy tests in parallel, security scans, image builds scanned
# with Trivy, then the Compose integration job that brings up every service and ingests the seed
# book through the real pipeline. Every job must pass before a merge (SEC-18, SEC-20).
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  CERBOS_VERSION: "0.46.0"
  GITLEAKS_VERSION: "8.21.2"
  UV_LOCKED: "1"

jobs:
  python-lint:
    name: Python lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run mypy apps/api/src apps/worker/src packages/ai-adapters/src packages/metadata/src
      - run: uv run bandit -c pyproject.toml -r apps packages -q

  python-tests:
    name: API and worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      JDHP_TEST_ADMIN_DATABASE_URL: postgresql://postgres@localhost:54329/postgres
      JDHP_TEST_REDIS_URL: redis://localhost:6379/0
      CERBOS_BIN: ${{ github.workspace }}/.ci-bin/cerbos
    steps:
      - uses: actions/checkout@v4
      - name: Install libvips and OpenJPEG for the derivative pipeline
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libvips42 libopenjp2-7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages
      - name: Install the Cerbos binary (the test session starts it locally)
        run: |
          mkdir -p .ci-bin
          curl -sSfL "https://github.com/cerbos/cerbos/releases/download/v${CERBOS_VERSION}/cerbos_${CERBOS_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C .ci-bin cerbos
      - name: API, worker and package tests with the 80 percent coverage gate on apps/api
        # The worker suite drives the seed book through the API's services, so it counts toward
        # the API's line coverage like every other caller of that code.
        run: uv run pytest apps/api/tests apps/worker/tests packages --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: coverage.xml
          if-no-files-found: ignore

  policies:
    name: Cerbos policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the Cerbos binary
        run: |
          mkdir -p .ci-bin
          curl -sSfL "https://github.com/cerbos/cerbos/releases/download/v${CERBOS_VERSION}/cerbos_${CERBOS_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C .ci-bin cerbos
      - run: .ci-bin/cerbos compile policies

  openapi-sync:
    name: OpenAPI document in sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages
      - name: Export the document from the application and compare with packages/schemas
        run: |
          uv run --package jdhp-api python -m jdhp_api.openapi_export /tmp/openapi.json
          diff -u packages/schemas/openapi.json /tmp/openapi.json || {
            echo "::error::packages/schemas/openapi.json is stale; run make openapi and commit the result"; exit 1; }

  javascript:
    name: Web lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jdhp/design-tokens build
      - name: Generated TypeScript types match the OpenAPI document
        run: |
          pnpm --filter @jdhp/schemas generate
          git diff --exit-code -- packages/schemas/src/generated || {
            echo "::error::packages/schemas/src/generated is stale; run make openapi and commit the result"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @jdhp/web build

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: uv sync --all-packages
      - run: pnpm install --frozen-lockfile
      - name: Semgrep (OWASP ruleset, Python, TypeScript)
        run: |
          uvx semgrep scan --config p/owasp-top-ten --config p/python --config p/typescript \
            --severity ERROR --error --metrics off \
            --exclude '**/tests/**' --exclude '**/test/**' --exclude '**/*.test.*' --exclude node_modules --exclude .venv
      - name: Bandit
        run: uv run bandit -c pyproject.toml -r apps packages -q
      - name: pip-audit against the locked Python dependencies
        run: |
          uv export --all-packages --format requirements-txt --no-emit-workspace --no-hashes -q -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --no-deps --progress-spinner off
      - name: npm audit (high and critical block; ignored advisories are listed in package.json)
        run: pnpm audit --audit-level high
      - name: gitleaks
        run: |
          mkdir -p .ci-bin
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C .ci-bin gitleaks
          .ci-bin/gitleaks detect --source . --redact --no-banner --exit-code 1

  images:
    name: Build and scan image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [python-lint, javascript]
    strategy:
      fail-fast: false
      matrix:
        # scan: Trivy vulnerability classes that block. "os,library" is the rule. The Cantaloupe
        # image is scanned for its operating system packages only: the Java libraries inside the
        # upstream release bundle cannot be replaced without rebuilding Cantaloupe from source,
        # which the Phase 1 tile gateway work decides (CHANGELOG, Security).
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            context: .
            scan: os,library
          - image: worker
            dockerfile: apps/worker/Dockerfile
            context: .
            scan: os,library
          - image: web
            dockerfile: apps/web/Dockerfile
            context: .
            scan: os,library
          - image: minio
            dockerfile: infra/compose/minio/Dockerfile
            context: infra/compose/minio
            scan: os,library
          - image: cantaloupe
            dockerfile: infra/cantaloupe/Dockerfile
            context: infra/cantaloupe
            scan: os
          - image: keycloak
            dockerfile: infra/keycloak/Dockerfile
            context: infra/keycloak
            scan: os,library
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: jdhp/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Trivy (high and critical, fixed vulnerabilities only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jdhp/${{ matrix.image }}:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: ${{ matrix.scan }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  integration:
    name: Compose stack and seed ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [python-tests, policies, openapi-sync, javascript]
    env:
      JDHP_SEED_SCALE: "0.5"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for the image builds and the stack
        # The hosted runner ships toolchains this job never uses; the stack's images, the Go module
        # cache of the MinIO build and the pulled services need the space. The default Docker
        # builder is used on purpose: a separate buildx container would hold a second copy of
        # every image.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: Configuration with generated secrets (no value is ever committed)
        run: infra/compose/make-env.sh
      - name: Start every service
        env:
          COMPOSE_FILE: docker-compose.yml:infra/compose/compose.ci.yaml
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Service state
        if: always()
        run: docker compose ps
      - name: Logs of services that are not healthy
        if: failure()
        run: |
          docker compose ps -a
          for name in $(docker compose ps -a --format '{{.Service}} {{.Status}}' | grep -vE '\(healthy\)|Exited \(0\)' | awk '{print $1}'); do
            echo "::group::$name"
            docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' "jdhp-$name-1" || true
            docker compose logs --no-color --tail=150 "$name" || true
            echo "::endgroup::"
          done
      - name: Ingest the seed book through the real pipeline with the mock OCR adapter
        run: docker compose run --rm seed
      - name: Wait for the batch to reach ingested
        run: |
          query() { docker compose exec -T postgres psql -U postgres -d jdhp -tAc "$1" | tr -d '[:space:]'; }
          progress_sql="select count(*) filter (where master_key is not null) || '/' || count(*) filter (where derivative_key is not null) || '/' || count(*) filter (where ocr_at is not null) || '/' || count(*) from page"
          for i in $(seq 1 120); do
            state=$(query "select state from intake_batch order by id desc limit 1")
            echo "intake batch state: ${state:-none} (pages with master/derivative/ocr of total: $(query "$progress_sql"))"
            case "$state" in
              ingested) exit 0 ;;
              failed)
                echo "::error::seed ingest failed: $(query "select coalesce(error_detail, '') from intake_batch order by id desc limit 1")"
                docker compose logs --no-color --tail=200 worker
                exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::seed ingest did not finish in time"
          echo "::group::worker log"
          docker compose logs --no-color --tail=400 worker
          echo "::endgroup::"
          exit 1
      - name: The seed book is published and readable through the stack
        run: |
          set -eu
          curl -sSf -o /tmp/works.json "http://localhost:8080/api/works?limit=5"
          python3 - <<'PY'
          import json
          works = json.load(open("/tmp/works.json"))
          assert works["total"] == 1, works
          work = works["items"][0]
          assert work["page_count"] == 40, work["page_count"]
          print("seed work:", work["public_id"], work["ark"], work["title_ar"])
          open("/tmp/work_id", "w").write(work["public_id"])
          open("/tmp/work_ark", "w").write(work["ark"])
          PY
          name=$(cat /tmp/work_id)
          curl -sSf -o /tmp/pages.json "http://localhost:8080/api/works/${name}/pages"
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/pages.json"))
          pages = d if isinstance(d, list) else d["items"]
          assert len(pages) == 40, len(pages)
          print("pages:", len(pages))
          PY
          curl -sSf -o /tmp/ar.html "http://localhost:8080/ar/works/${name}"
          grep -q 'dir="rtl"' /tmp/ar.html
          curl -sSf -o /dev/null -D - "http://localhost:8080/en" | grep -i "content-security-policy" | grep -q "nonce-"
          curl -sS -o /dev/null -w "ark redirect: %{http_code} %{redirect_url}\n" "http://localhost:8080/$(cat /tmp/work_ark)"
      - name: Tiles reach the browser only through the authorizing gateway (RDR-1, SEC-10, SEC-14)
        run: |
          set -eu
          name=$(cat /tmp/work_id)
          # A sample page of a Registered work is public, served as WebP through Cantaloupe with the platform mark.
          curl -sSf -o /tmp/sample.webp -D /tmp/sample.headers "http://localhost:8080/iiif/3/${name}-p0001/0,0,512,512/512,/0/default.webp"
          grep -qi "content-type: image/webp" /tmp/sample.headers
          python3 -c "d=open('/tmp/sample.webp','rb').read(); assert d[:4]==b'RIFF' and d[8:12]==b'WEBP', d[:16]; print('sample tile bytes:', len(d))"
          curl -sSf -o /tmp/info.json "http://localhost:8080/iiif/3/${name}-p0001/info.json"
          python3 -c "import json; d=json.load(open('/tmp/info.json')); assert d['type']=='ImageService3' and d['maxArea']<=1048576, d; print('info.json ok', d['width'], d['height'])"
          # Outside the sample range nothing is served without a reader session; full/max is never served for a protected work.
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:8080/iiif/3/${name}-p0011/0,0,512,512/512,/0/default.webp")" = "403"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:8080/iiif/3/${name}-p0001/full/max/0/default.webp")" = "403"
          # Cantaloupe itself is not reachable from outside the stack.
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:8182/iiif/3/" || true)" != "200"
      - name: Search finds the seed book by its page text and answers with regions, never text (SRCH-1, SRCH-3, SRCH-4, CAT-4)
        run: |
          set -eu
          # "الكرم" without diacritics; the pages carry it as "الكَرْم".
          curl -sSf -o /tmp/search.json "http://localhost:8080/api/search?q=%D8%A7%D9%84%D9%83%D8%B1%D9%85&pages_per_work=10"
          python3 - <<'PY'
          import json, re
          raw = open("/tmp/search.json", encoding="utf-8").read()
          body = json.loads(raw)
          assert body["total_works"] == 1, body["total_works"]
          work = body["works"][0]
          assert work["work"]["public_id"] == open("/tmp/work_id").read().strip(), work["work"]
          seqs = sorted(p["seq"] for p in work["pages"])
          print("page hits:", seqs, "of", work["page_hits_total"], "expanded:", body["expanded_terms"])
          assert work["page_hits_total"] >= 5, work["page_hits_total"]
          visible = [p for p in work["pages"] if p["scan_visible"]]
          hidden = [p for p in work["pages"] if not p["scan_visible"]]
          # Anonymous: sample pages (1-10 of a Registered work) come with regions, the rest without.
          assert visible and all(p["seq"] <= 10 and p["regions"] for p in visible), visible
          assert hidden and all(p["seq"] > 10 and p["regions"] == [] for p in hidden), hidden
          def keys(value):
              found = set()
              if isinstance(value, dict):
                  for key, item in value.items():
                      found.add(key); found |= keys(item)
              elif isinstance(value, list):
                  for item in value:
                      found |= keys(item)
              return found
          assert not keys(body) & {"text", "ocr_text", "snippet", "highlight", "excerpt"}, keys(body)
          # Not one line of the ground truth of a hit page appears in the response (CAT-4).
          book = json.load(open("apps/api/src/jdhp_api/seed/book/book.json", encoding="utf-8"))
          checked = 0
          for page in book["pages"]:
              if page["seq"] not in seqs:
                  continue
              for block in page["blocks"]:
                  for line in block.get("lines", []):
                      if isinstance(line, str) and len(line.split()) >= 4:
                          assert line not in raw, line
                          checked += 1
          assert checked > 0
          assert not re.search(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", raw)
          print(f"search ok: {len(visible)} visible pages with regions, {len(hidden)} hidden, {checked} ground-truth lines absent")
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser for the end-to-end suite
        run: pnpm --filter @jdhp/e2e exec playwright install --with-deps chromium
      - name: End-to-end suite in Arabic and English with axe (Phase 1 gate, ACX-1)
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
          E2E_MAILPIT_URL: http://localhost:8025
        run: |
          set -eu
          export E2E_KC_ADMIN_USER="$(grep -E '^KEYCLOAK_ADMIN=' .env | cut -d= -f2 | cut -d'#' -f1 | tr -d ' ')"
          export E2E_KC_ADMIN_PASSWORD="$(grep -E '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2 | cut -d'#' -f1 | tr -d ' ')"
          pnpm --filter @jdhp/e2e test
      - name: End-to-end report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
      - name: Collect logs
        if: failure()
        run: |
          # The gateway and image server logs are the ones a tile failure needs; the rest travel as an artifact.
          docker compose logs --no-color --tail=120 tiles cantaloupe || true
          docker compose logs --no-color > compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose.log
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans
