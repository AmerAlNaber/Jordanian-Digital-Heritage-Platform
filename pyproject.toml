# Workspace root for the Python side of the monorepo. Not a distribution.
# Members are installed into one virtual environment with `uv sync --all-packages`.

[project]
name = "jdhp-workspace"
version = "0.0.0"
description = "Jordanian Digital Heritage Platform: Python workspace root"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/ai-adapters", "packages/metadata"]

[tool.uv.sources]
jdhp-api = { workspace = true }
jdhp-adapters = { workspace = true }
jdhp-metadata = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.13",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "import-linter>=2.3",
  "bandit[toml]>=1.8",
  "pip-audit>=2.9",
  "httpx>=0.28",
  "types-PyYAML",
  "types-defusedxml",
  "pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# Shared tool configuration. Packages inherit these settings.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/worker/src", "packages/ai-adapters/src", "packages/metadata/src"]
extend-exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "DTZ", "T20", "PT",
  "RET", "SIM", "ARG", "PL", "RUF", "PIE", "TID", "TC", "PERF",
]
ignore = [
  "PLR0913",  # many arguments are normal for service functions with explicit parameters
  "PLR2004",  # magic values are checked case by case
  "RUF012",   # mutable class attributes are handled by SQLAlchemy and Pydantic
  "TC001", "TC002", "TC003",  # runtime imports are needed for Pydantic and SQLAlchemy annotations
  "PLR0912",  # validators with many independent checks
  "PLR0917",  # FastAPI handlers declare their dependencies positionally
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "PLR0915", "ARG001", "ARG002"]
"**/alembic/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body", "fastapi.Security", "fastapi.params.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["jdhp_api", "jdhp_worker", "jdhp_adapters", "jdhp_metadata"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "apps/api/src:apps/worker/src:packages/ai-adapters/src:packages/metadata/src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pyvips", "pyvips.*", "celery", "celery.*", "kombu", "kombu.*", "arabic_reshaper", "bidi", "bidi.*", "boto3", "boto3.*", "botocore", "botocore.*", "cerbos", "cerbos.*", "opensearchpy", "opensearchpy.*", "jwt", "jwt.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/ai-adapters/tests", "packages/metadata/tests"]
filterwarnings = ["error::DeprecationWarning:jdhp_.*"]
markers = [
  "integration: needs the full compose stack",
]

[tool.coverage.run]
branch = true
source = ["jdhp_api"]
omit = ["*/alembic/*", "*/seed/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules"]
skips = ["B101"]

[tool.importlinter]
root_packages = ["jdhp_api", "jdhp_worker"]

[[tool.importlinter.contracts]]
name = "Routers never import models directly"
type = "forbidden"
source_modules = ["jdhp_api.modules.*.router"]
forbidden_modules = ["jdhp_api.modules.*.models"]

[[tool.importlinter.contracts]]
name = "Worker tasks write only through API services"
type = "forbidden"
source_modules = ["jdhp_worker"]
forbidden_modules = ["jdhp_api.modules.*.models"]
